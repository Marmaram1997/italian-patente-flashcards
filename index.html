<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patente Flash — Italian → Persian</title>
<meta name="theme-color" content="#1e3651">
<meta name="description" content="1,949 flashcards from the Italian Patente B handout, Italian → Persian.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patente Flash">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --p900:#2e1065;--p800:#4c1d95;--p700:#6d28d9;--p600:#7c3aed;--p500:#8b5cf6;--p300:#c4b5fd;--p100:#ede9fe;--p50:#f5f3ff;
  --ink:#1e1b2e;--muted:#6b6385;--bg:#f7f5fc;--line:#e4def5;--heart:#e11d48;--good:#15803d;--bad:#b45309;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Vazirmatn,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html[dir=rtl] body{font-family:Vazirmatn,Inter,system-ui,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--p500);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.fa{font-family:Vazirmatn,sans-serif;direction:rtl;unicode-bidi:isolate}
.it-t{font-family:Inter,sans-serif;direction:ltr;unicode-bidi:isolate}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hide{display:none!important}
.top{display:flex;align-items:center;gap:10px}
.top img{border-radius:10px;flex:none}
.top h1{font-size:19px;font-weight:800;margin:0;color:var(--p800);letter-spacing:-.01em}
.top .sub{margin:1px 0 0;color:var(--muted);font-size:12.5px}
.hbtns{margin-inline-start:auto;display:flex;gap:8px;flex:none}
.round{height:40px;min-width:40px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--p800);font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.round.on{background:var(--p700);border-color:var(--p700);color:#fff}
.rel{position:relative}
.menu{position:absolute;top:46px;inset-inline-end:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 30px -12px rgba(46,16,101,.35);padding:6px;min-width:170px;z-index:40;display:none}
.menu.on{display:block}
.menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;border:none;background:none;font-size:14.5px;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:start}
.menu button:hover{background:var(--p50)}
.menu button[aria-checked=true]{color:var(--p700);font-weight:700}
.views{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0 12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px}
.vtab{font-size:14px;font-weight:700;padding:10px 4px;border:none;border-radius:10px;background:none;color:var(--muted);cursor:pointer}
.vtab[aria-selected=true]{background:var(--p700);color:#fff}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.btn{font-weight:700;font-size:15px;padding:14px 12px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--p800);cursor:pointer;min-height:48px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--p700);border-color:var(--p700);color:#fff}
.btn.again{background:#fff7ed;border-color:#fdba74;color:#9a3412}
.btn.good{background:#ecfdf3;border-color:#86efac;color:#166534}
.btn.soft{background:var(--p50);border-color:var(--p100)}
.btn.block{width:100%;display:block}
.muted{color:var(--muted);font-size:14px;line-height:1.5;margin:0}
.h3{font-size:15px;font-weight:800;color:var(--p900);margin:0 0 2px;display:block}
input[type=search],input[type=text],input[type=email]{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--p300);border-color:var(--p500)}
.hello{font-size:21px;font-weight:800;color:var(--p900);margin:0 0 12px}
.hero{display:grid;gap:10px}
.hero .primary{font-size:16px;padding:16px 14px;text-align:center;line-height:1.35}
.hero .primary small{display:block;font-weight:500;font-size:13px;opacity:.85;margin-top:2px}
.learned{display:flex;align-items:center;gap:12px;margin-top:2px}
.learned b{font-size:15px;color:var(--p800)}
.pbar{flex:1;height:8px;background:var(--p100);border-radius:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--p500),var(--p700));width:0}
.learned span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sync{display:flex;gap:12px;align-items:center;background:var(--p50);border:1px solid var(--p100)}
.sync p{flex:1}
.sync .btn{min-height:40px;padding:9px 14px;font-size:14px;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.pgTitle{font-size:17px;margin-bottom:12px}
.pgTop{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
html[dir=rtl] .ring svg{transform:rotate(-90deg) scaleY(-1)}
.ring circle{fill:none;stroke-width:11}
.ring .rb{stroke:var(--p100)}
.ring .rf{stroke:var(--p600);stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset .6s ease}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rc b{font-size:24px;font-weight:800;color:var(--p800);font-variant-numeric:tabular-nums}
.ring .rc span{font-size:12px;color:var(--muted)}
.pgStats{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.pgStats b{display:block;font-size:20px;font-weight:800;color:var(--p900);font-variant-numeric:tabular-nums}
.pgStats span{font-size:12.5px;color:var(--muted);line-height:1.3;display:block}
.pgNext{display:block;width:100%;margin-top:14px;text-align:start;background:var(--p50);border:1px solid var(--p100);border-radius:14px;padding:11px 14px;cursor:pointer;font-size:14px;color:var(--p900);line-height:1.45}
.pgNext small{display:block;color:var(--muted);font-size:12.5px}
#progPanel .chToggle{border-top:1px solid var(--line);padding-top:14px}
@media (max-width:360px){.pgTop{gap:12px}.ring{width:100px;height:100px}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:start;cursor:pointer}
.kpi:hover{border-color:var(--p300)}
.kpi b{display:block;font-size:22px;color:var(--p800)}
.kpi span{font-size:12.5px;color:var(--muted)}
.chToggle{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;border:none;background:none;cursor:pointer;padding:0;text-align:start}
.chSum{display:block;font-size:13px;color:var(--muted)}
.chev{font-size:22px;color:var(--p700);line-height:1;transition:transform .2s}
.chToggle[aria-expanded=true] .chev{transform:rotate(180deg)}
.chs{display:grid;gap:2px;margin-top:12px}
.chr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:9px 8px;border-radius:12px;border:none;background:none;cursor:pointer;text-align:start;width:100%}
.chr:hover,.chr[aria-current=true]{background:var(--p50)}
.chr .nm{font-size:14px;font-weight:600;text-align:left}
.chr .nmf{font-size:12.5px;color:var(--muted);text-align:right;grid-column:1}
.chr .ct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;grid-row:1;grid-column:2}
.chr .pb{grid-column:1/-1;height:5px;background:var(--p100);border-radius:5px;overflow:hidden;margin-top:4px}
.chr .pb i{display:block;height:100%;background:var(--p600)}
html[dir=ltr] .chr .nmf{text-align:left}
html[dir=rtl] .chr .nm{text-align:right}
.shead{display:flex;gap:8px;align-items:stretch}
.chapBtn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px;cursor:pointer;text-align:start}
.chapBtn .cnum{flex:none;font-size:12px;font-weight:700;color:var(--p700);background:var(--p50);border-radius:999px;padding:3px 9px}
.chapBtn .names{min-width:0;flex:1}
.chapBtn .names .it-t,.chapBtn .names .fa{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chapBtn .names .it-t{font-size:14px;font-weight:700;text-align:left}
.chapBtn .names .fa{font-size:12.5px;color:var(--muted);text-align:right}
html[dir=ltr] .chapBtn .names .fa{text-align:left}
html[dir=rtl] .chapBtn .names .it-t{text-align:right}
.chapBtn .chev{font-size:18px}
.toolBtn{flex:none;width:48px;min-height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px}
.toolBtn[aria-expanded=true]{background:var(--p700);border-color:var(--p700);color:#fff}
.tools{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px;display:grid;gap:8px}
.chip{font-size:13.5px;font-weight:600;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--p800);cursor:pointer;min-height:38px}
.chip[aria-pressed=true]{background:var(--p700);border-color:var(--p700);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:8px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px}
.set{font-size:13px;font-weight:600;padding:9px 4px;border:none;border-radius:10px;background:none;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set[aria-selected=true]{background:var(--p100);color:var(--p800)}
.meta{display:flex;align-items:center;gap:10px;margin:4px 2px 8px}
.counter{font-size:13px;font-weight:700;color:var(--p800);font-variant-numeric:tabular-nums;white-space:nowrap}
.meta .pbar{height:5px}
.reviewBar{display:flex;align-items:center;gap:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:14px;padding:10px 12px;margin-bottom:8px;font-weight:700;font-size:14px}
.reviewBar .x{margin-inline-start:auto;border:none;background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:700;color:#9a3412;min-height:36px}
.startReview{margin:0 0 8px}
.stage{perspective:1400px;position:relative}
.card{position:relative;width:100%;height:clamp(250px,48vh,400px);transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
.face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 22px;text-align:center;box-shadow:0 18px 40px -18px rgba(76,29,149,.55);overflow:auto}
.front{background:radial-gradient(120% 120% at 15% 10%,#8b5cf6 0%,#6d28d9 45%,#4c1d95 100%);color:#fff}
.back{background:#fff;color:var(--ink);border:2px solid var(--p300);transform:rotateY(180deg)}
.front .term{font-weight:800;font-size:clamp(30px,8vw,48px);line-height:1.12;letter-spacing:-.015em;word-break:break-word}
.front .hint{margin-top:18px;font-size:13px;opacity:.8}
.back .mean{font-family:Vazirmatn,sans-serif;direction:rtl;font-weight:800;font-size:clamp(26px,7vw,40px);line-height:1.5;color:var(--p900)}
.back .term2{margin-top:10px;font-size:16px;font-weight:600;color:var(--p700)}
.ex{margin-top:16px;width:100%;max-width:460px;background:var(--p50);border-radius:14px;padding:10px 14px;text-align:start}
.ex .lbl{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.ex .it-t{display:block;font-size:15px;font-style:italic;text-align:left}
.ex .fa{display:block;font-size:15px;margin-top:4px;text-align:right}
.ex .flag{display:inline-block;margin-top:6px;font-size:11.5px;color:#9a3412;background:#fff7ed;border-radius:999px;padding:2px 8px}
.badges{position:absolute;top:14px;inset-inline-start:16px;display:flex;gap:6px}
.badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.2);color:#fff}
.back .badge{background:var(--p50);color:var(--p800)}
.heart{position:absolute;top:10px;inset-inline-end:10px;z-index:5;width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.18);cursor:pointer;display:flex;align-items:center;justify-content:center}
.heart svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2}
.card.flipped~.heart{background:var(--p50)}
.card.flipped~.heart svg{stroke:var(--p700)}
.heart.on,.card.flipped~.heart.on{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.heart.on svg,.card.flipped~.heart.on svg{fill:var(--heart);stroke:var(--heart)}
.empty{padding:44px 20px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:20px;line-height:1.6}
.actions{position:sticky;bottom:0;z-index:10;margin:12px -16px 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 75%,rgba(247,245,252,0));display:grid;grid-template-columns:48px 1fr 1fr 48px;gap:8px}
.actions .nav{border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--p800);font-size:22px;cursor:pointer;min-height:52px}
.actions .wide{grid-column:2/4}
.actions .btn{min-height:52px}
.actions.review{grid-template-columns:1fr 1fr}
.actions.review .nav{display:none}
.actions.review .wide{grid-column:1/3}
.kbd{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
@media (hover:none){.kbd{display:none}}
.list{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:grid;grid-template-columns:1fr 1fr 40px;gap:12px;padding:11px 14px;border-top:1px solid var(--p50);align-items:center}
.li:first-child{border-top:none}
.li .l-it{font-weight:600;color:var(--p900);font-size:14.5px;text-align:left}
.li .l-fa{font-size:15px;color:#3b3355;text-align:right}
.li.k .l-it::after{content:" ✓";color:var(--good)}
.li.w .l-it::after{content:" ✗";color:var(--bad)}
.li-h{border:none;background:none;cursor:pointer;padding:6px;display:flex}
.li-h svg{width:20px;height:20px;fill:none;stroke:#c9c2dd;stroke-width:2}
.li-h.on svg{fill:var(--heart);stroke:var(--heart)}
.more{display:block;width:100%;border:none;border-top:1px solid var(--line);background:var(--p50);color:var(--p800);font-weight:600;padding:12px;cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(30,27,46,.45);display:none;z-index:50;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:22px}}
.sheet h2{margin:0 0 6px;font-size:20px;color:var(--p900)}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:14.5px;line-height:1.55}
.close{float:right;border:none;background:var(--p50);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--p800)}
html[dir=rtl] .close{float:left}
.login{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font-weight:600;font-size:15px;padding:13px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;margin-top:8px;min-height:48px}
.login.primary{background:var(--p700);color:#fff;border-color:var(--p700)}
.login svg{width:20px;height:20px}
.linkbtn{display:block;width:100%;margin-top:8px;border:none;background:none;font-size:14px;color:var(--muted);cursor:pointer;padding:10px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin:14px 0 6px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{font-size:13px;color:var(--muted);margin-top:10px;text-align:center;line-height:1.5}
.msg.err{color:#b91c1c}
label.sm{font-size:13px;font-weight:600;color:var(--p800);display:block;margin:6px 0}
.danger{color:#b91c1c;border:1px solid #fecaca}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--p50);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--p800)}
.stat span{font-size:12px;color:var(--muted)}
.done{text-align:center}
.done .big{font-size:44px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13.5px;padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (max-width:420px){.kpis{gap:8px}.kpi{padding:10px}.kpi b{font-size:20px}.li{grid-template-columns:1fr 40px}.li .l-fa{grid-column:1}.li .li-h{grid-row:1/3;grid-column:2}}
@media (min-width:700px){.card{height:380px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img src="icon-192.png" alt="" width="40" height="40">
    <div>
      <h1>Patente Flash</h1>
      <p class="sub"><span id="total">…</span> <span data-t="cards"></span> · <bdi class="it-t">Italiano</bdi> → <bdi class="fa">فارسی</bdi></p>
    </div>
    <div class="hbtns">
      <div class="rel">
        <button class="round" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-controls="langMenu"><span aria-hidden="true">🌐</span> <span id="langCode">EN</span><span class="sr" data-t="language"></span></button>
        <div class="menu" id="langMenu" role="menu">
          <button role="menuitemradio" data-lang="en" aria-checked="true">English <span>EN</span></button>
          <button role="menuitemradio" data-lang="fa" aria-checked="false"><span class="fa">فارسی</span> <span>FA</span></button>
        </div>
      </div>
      <button class="round" id="avatar"><span id="avatarTxt" aria-hidden="true">👤</span><span class="sr" id="avatarLbl"></span></button>
    </div>
  </header>

  <nav class="views" role="tablist">
    <button class="vtab" role="tab" id="tabDash" data-view="dash" aria-selected="true" aria-controls="dashView" data-t="dashboard"></button>
    <button class="vtab" role="tab" id="tabStudy" data-view="study" aria-selected="false" aria-controls="studyView" data-t="study"></button>
  </nav>

  <section id="dashView" role="tabpanel" aria-labelledby="tabDash">
    <div class="panel">
      <p class="hello" id="hello"></p>
      <div class="hero">
        <button class="btn primary" id="mainBtn"></button>
        <div class="learned"><b id="learnedTxt"></b><span class="pbar" aria-hidden="true"><i id="learnedBar"></i></span><span id="learnedPct"></span></div>
        <button class="btn again hide" id="reviewBtn"></button>
        <button class="btn soft" id="chooseBtn" data-t="chooseChapter"></button>
      </div>
    </div>
    <div class="panel sync hide" id="syncCard">
      <p class="muted" data-t="syncText"></p>
      <button class="btn" id="syncSignIn" data-t="signIn"></button>
    </div>
    <div class="panel" id="progPanel" aria-labelledby="progTitle">
      <h2 class="h3 pgTitle" id="progTitle" data-t="yourProgress"></h2>
      <div class="pgTop">
        <div class="ring" id="ring" role="img">
          <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="rb" cx="60" cy="60" r="52"/><circle class="rf" id="ringFill" cx="60" cy="60" r="52"/></svg>
          <div class="rc"><b id="ringPct">0%</b><span data-t="learnedLow"></span></div>
        </div>
        <div class="pgStats">
          <div><b id="pLearned">0</b><span id="pLearnedL"></span></div>

  var lang='en';

  function n2(n){return lang==='fa'?String(n).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]}):String(n)}

  /* ================= state ================= */

  var S={known:{},fav:{},wrong:{},name:'',updated:0,rev:{},sess:0,pos:null};
  var KEY='patente-flash-v2';
  var user=null,canLogin=false,saveTimer=null,sb=null,token=null;
  var st={ch:'1',set:'all',view:[],idx:0,revealed:false,mode:'regular',rq:[],rTotal:0,rAgainSet:{},rOrig:[],list:false,shown:200};

  function keys(o){return Object.keys(o)}
  function loadLocal(){
    try{var d=JSON.parse(ls(KEY)||'null');

      else{S.known=JSON.parse(ls('patente-known')||'{}')||{}}}catch(e){}
  }
  function saveLocal(){ls(KEY,JSON.stringify(S))}
  function changed(){S.updated=Date.now();saveLocal();counts();if(user){clearTimeout(saveTimer);saveTimer=setTimeout(pushRemote,1200)}}

  /* ================= sync ================= */
  function authHeaders(h){h=h||{};if(token)h['X-Sb-Token']=token;return h}
  function syncState(k){$('syncState').textContent=k?t(k):''}
  function payload(){return{known:keys(S.known),fav:keys(S.fav),wrong:keys(S.wrong),name:S.name,rev:S.rev,sess:S.sess,pos:S.pos}}
  function pushRemote(){
    if(!user)return;syncState('saving');
    fetch('/api/progress',{method:'PUT',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify(payload())})
      .then(function(r){if(!r.ok)throw 0;syncState('saved')}).catch(function(){syncState('notSaved');clearTimeout(saveTimer);saveTimer=setTimeout(pushRemote,15000)});
  }
  function pullRemote(){
    syncState('syncing');
    return fetch('/api/progress',{headers:authHeaders()}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
      var hadLocal=keys(S.known).length+keys(S.fav).length+keys(S.wrong).length>0||!!S.pos;

      if(hadLocal)pushRemote();

  }

    $('q').placeholder=t('search');$('q').setAttribute('aria-label',t('search'));$('wName').placeholder=t('namePh');$('askInput').placeholder=t('namePh');
    $('prevIco').textContent=lang==='fa'?'›':'‹';$('backIco').textContent=$('backIco2').textContent=lang==='fa'?'→':'←';$('backBtn2').setAttribute('aria-label',t('back'));$('nextIco').textContent=lang==='fa'?'‹':'›';
    if(ALL.length){$('total').textContent=n2(ALL.length);counts();renderDash();renderStudyHead();if(isStudy()){var r=st.revealed;renderCard();if(r)setFlip(true,true)}renderList()}

  $('doneBack').onclick=backToRegular;$('doneDash').onclick=function(){showView('dash')};

  /* ================= keyboard + swipe ================= */
  document.addEventListener('keydown',function(e){
    var tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
    var open=document.querySelector('.scrim.on');
    if(e.key==='Escape'){if(open){if(open.id==='welcome')takeWName();closeSheet(open.id)}$('langMenu').classList.remove('on');return}
    if(open||!isStudy()||!cur()||(st.list&&st.mode!=='review')||e.metaKey||e.ctrlKey||e.altKey)return;
    var fwd=lang==='fa'?'ArrowLeft':'ArrowRight',back=lang==='fa'?'ArrowRight':'ArrowLeft';
    if(e.key===' '&&tg!=='BUTTON'){e.preventDefault();reveal()}
    else if(e.key===fwd)go(1);else if(e.key===back)go(-1);
    else if(e.key==='k'||e.key==='K'){if(st.revealed)answer(true);else setFlip(true)}
    else if(e.key==='r'||e.key==='R'||e.key==='x'||e.key==='X'){if(st.revealed)answer(false);else setFlip(true)}
    else if(e.key==='f'||e.key==='F')$('heart').click();
  });
  var sx=null,sy=null;
  $('stage').addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  $('stage').addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){e.preventDefault();var d=dx<0?1:-1;if(lang==='fa')d=-d;go(d)}sx=null},{passive:false});

  /* ================= auth (Supabase) ================= */
  function readUrlError(){
    var q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,''));
    var m=q.get('error_description')||h.get('error_description')||q.get('error')||h.get('error');
    return m?m.replace(/\+/g,' '):null;
  }
  function cleanUrl(){if(location.search||location.hash)history.replaceState(history.state,'',location.pathname)}
  function initAuth(){
    var C=window.PATENTE_CONFIG||{};var urlErr=readUrlError();SHOW_FLAGGED=!!C.showFlaggedExamples;
    if(!window.supabase||!C.supabaseUrl||!C.supabaseAnonKey){canLogin=false;renderProfile();renderDash();return}
    try{sb=window.supabase.createClient(C.supabaseUrl,C.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}})}
    catch(e){canLogin=false;renderProfile();renderDash();return}
    canLogin=true;
    var g=(C.providers||[]).indexOf('google')>=0;$('loginGoogle').classList.toggle('hide',!g);$('orLine').classList.toggle('hide',!g);
    var first=true;
    sb.auth.onAuthStateChange(function(ev,session){
      var wasUser=!!user;token=session?session.access_token:null;
      var u=session&&session.user;
      user=u?{id:u.id,email:u.email||'',provider:(u.app_metadata&&u.app_metadata.provider)||'email',meta:u.user_metadata||{}}:null;
      renderProfile();renderDash();
      if(user&&!wasUser){
        if(!S.name&&(user.meta.full_name||user.meta.name)){S.name=String(user.meta.full_name||user.meta.name).slice(0,40);saveLocal()}
        pullRemote().then(function(){if(!S.name)setTimeout(function(){$('askInput').value='';openSheet('askName')},500)});
        closeSheet('welcome');if(ev==='SIGNED_IN')toast(t('welcomeBack'));cleanUrl();
      }
      if(first){first=false;if(urlErr&&!user){openWelcome();showMsg(t('linkError',{m:urlErr}),true);cleanUrl()}}
    });
    renderDash();
  }
  function showMsg(s,err){var m=$('loginMsg');m.textContent=s;m.classList.toggle('err',!!err)}
  function takeWName(){var v=$('wName').value.trim().slice(0,40);if(v&&v!==S.name){S.name=v;changed();renderDash();renderProfile()}return v}
  $('loginGoogle').onclick=function(){if(!sb)return;takeWName();showMsg(t('opening'));
    sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/'}}).then(function(r){if(r.error)showMsg(t('error')+r.error.message,true)})};
  $('emailForm').onsubmit=function(e){
    e.preventDefault();if(!sb)return;var em=$('emailInput').value.trim();if(!em)return;
    var nm=takeWName();$('emailBtn').disabled=true;showMsg(t('sending'));
    sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+'/',data:nm?{full_name:nm}:undefined}}).then(function(r){
      $('emailBtn').disabled=false;if(r.error)showMsg(t('error')+r.error.message,true);else showMsg(t('linkSent',{e:em}))});
  };
  $('logout').onclick=function(){if(sb)sb.auth.signOut();user=null;token=null;renderProfile();renderDash();closeSheet('profile');toast(t('signedOut'))};
  function openWelcome(){showMsg('');$('wName').value=S.name||'';openSheet('welcome')}
  $('avatar').onclick=function(){if(user){counts();openSheet('profile')}else openWelcome()};
  $('nameInput').onchange=function(){S.name=this.value.trim().slice(0,40);changed();renderProfile();renderDash()};
  $('nameForm').onsubmit=function(e){e.preventDefault();var v=$('askInput').value.trim().slice(0,40);if(!v)return;S.name=v;changed();renderDash();renderProfile();closeSheet('askName')};
  function displayName(){return S.name||(user&&(user.meta.full_name||user.meta.name||(user.email||'').split('@')[0]))||''}
  function renderProfile(){
    $('authBox').classList.toggle('hide',!canLogin);$('noLogin').classList.toggle('hide',canLogin);
    var nm=displayName();
    if(user){
      $('pTitle').textContent=t('hello',{n:nm});$('nameInput').value=S.name||'';
      var pv={google:'Google',email:'email'}[user.provider]||user.provider;
      $('pMeta').textContent=t('signedWith',{p:pv})+(user.email?' · '+user.email:'');
      $('avatarTxt').textContent=(nm.trim()[0]||'★').toUpperCase();$('avatar').classList.add('on');$('avatarLbl').textContent=t('profile');
    }else{$('avatarTxt').textContent='👤';$('avatar').classList.remove('on');$('avatarLbl').textContent=t('signInBtn')}
  }

  /* ================= start ================= */
  loadLocal();
  if(!history.state)history.replaceState({v:'dash'},'');
  applyLang(ls('patente-lang')||'en');
  fetch('cards.json').then(function(r){return r.json()}).then(function(d){
    CH=d.chapters||{};CHFA=d.chaptersFa||{};EX=d.examples||{};ALL=d.cards;
    ALL.forEach(function(c){BYTERM[c[0]]=c});
    $('total').textContent=n2(ALL.length);
    counts();renderDash();renderStudyHead();initAuth();
  }).catch(function(){$('hello').textContent='Could not load the cards.'});
})();
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
