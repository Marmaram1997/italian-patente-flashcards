<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patente Flash — Italian → Persian</title>
<meta name="theme-color" content="#1e3651">
<meta name="description" content="1,949 flashcards from the Italian Patente B handout, Italian → Persian.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patente Flash">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --p900:#2e1065;--p800:#4c1d95;--p700:#6d28d9;--p600:#7c3aed;--p500:#8b5cf6;--p300:#c4b5fd;--p100:#ede9fe;--p50:#f5f3ff;
  --ink:#1e1b2e;--muted:#6b6385;--bg:#f7f5fc;--line:#e4def5;--heart:#e11d48;--good:#16a34a;--bad:#c2410c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Vazirmatn,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html[dir=rtl] body{font-family:Vazirmatn,Inter,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.fa{font-family:Vazirmatn,sans-serif}
.ltr{direction:ltr;unicode-bidi:isolate}
.top{display:flex;align-items:center;gap:12px}
.top img{border-radius:10px;flex:none}
.top h1{font-size:20px;font-weight:800;margin:0;color:var(--p800);letter-spacing:-.01em}
.top .sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.hbtns{margin-inline-start:auto;display:flex;gap:8px;flex:none}
.round{height:40px;min-width:40px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--p800);font:inherit;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.round.on{background:var(--p700);border-color:var(--p700);color:#fff}
.menu{position:absolute;top:46px;inset-inline-end:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 30px -12px rgba(46,16,101,.35);padding:6px;min-width:170px;z-index:40;display:none}
.menu.on{display:block}
.menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;border:none;background:none;font:inherit;font-size:14.5px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--ink);text-align:start}
.menu button:hover{background:var(--p50)}
.menu button[aria-checked=true]{color:var(--p700);font-weight:700}
.rel{position:relative}
.views{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:16px 0 12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px}
.vtab{font:inherit;font-size:14px;font-weight:700;padding:10px 4px;border:none;border-radius:10px;background:none;color:var(--muted);cursor:pointer}
.vtab[aria-selected=true]{background:var(--p700);color:#fff}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0 0 10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px}
.tab{font:inherit;font-size:12.5px;font-weight:600;padding:9px 2px;border:none;border-radius:10px;background:none;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected=true]{background:var(--p100);color:var(--p800)}
.tab .n{font-weight:500;opacity:.8}
.controls{display:grid;gap:8px;margin-bottom:10px}
select,input[type=search],input[type=text],input[type=email]{width:100%;font:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
select:focus,input:focus{outline:2px solid var(--p300);border-color:var(--p500)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font:inherit;font-size:13px;font-weight:600;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--p800);cursor:pointer}
.chip[aria-pressed=true]{background:var(--p700);border-color:var(--p700);color:#fff}
.stats{margin-inline-start:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--p100);border-radius:6px;overflow:hidden;margin:12px 0 18px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p500),var(--p700));transition:width .25s}
.stage{perspective:1400px;position:relative}
.card{position:relative;width:100%;height:min(56vh,380px);min-height:260px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);border:none;padding:0;background:none;font:inherit;display:block}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;text-align:center;box-shadow:0 18px 40px -18px rgba(76,29,149,.55)}
.front{background:radial-gradient(120% 120% at 15% 10%,#8b5cf6 0%,#6d28d9 45%,#4c1d95 100%);color:#fff}
.back{background:radial-gradient(120% 120% at 85% 10%,#a78bfa 0%,#7c3aed 40%,#5b21b6 100%);color:#fff;transform:rotateY(180deg)}
.tag{position:absolute;top:16px;left:18px;right:64px;display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.75;direction:ltr}
.it{font-family:Inter,sans-serif;font-weight:700;font-size:clamp(26px,6vw,42px);line-height:1.15;letter-spacing:-.015em;word-break:break-word;direction:ltr}
.hint{position:absolute;bottom:16px;left:16px;right:16px;font-size:12px;opacity:.75}
.fa-main{font-family:Vazirmatn,sans-serif;direction:rtl;font-weight:700;font-size:clamp(22px,5.2vw,34px);line-height:1.6}
.it-small{font-family:Inter,sans-serif;font-size:14px;font-weight:500;opacity:.8;margin-top:14px;direction:ltr}
.badges{position:absolute;bottom:16px;right:18px;display:flex;gap:6px}
.badge{font-size:12px;font-weight:600;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:999px;display:none}
.card.is-known .b-known,.card.is-wrong .b-wrong{display:block}
.heart{position:absolute;top:10px;right:10px;z-index:5;width:46px;height:46px;border-radius:50%;border:none;background:rgba(255,255,255,.16);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.heart:active{transform:scale(.9)}
.heart svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2}
.heart.on{background:#fff}
.heart.on svg{fill:var(--heart);stroke:var(--heart)}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:16px}
.btn{font:inherit;font-weight:600;font-size:14px;padding:13px 8px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--p800);cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--p700);border-color:var(--p700);color:#fff}
.btn.good{background:#ecfdf3;border-color:#b7ebc9;color:#166534}
.btn.again{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
.empty{padding:50px 20px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:18px;line-height:1.6}
.list{display:none;margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list.on{display:block}
.li{display:grid;grid-template-columns:1fr 1fr 34px;gap:12px;padding:11px 14px;border-top:1px solid var(--p50);align-items:center}
.li:first-child{border-top:none}
.li .l-it{font-weight:600;color:var(--p900);font-size:14.5px;direction:ltr;text-align:left}
.li .l-fa{font-family:Vazirmatn,sans-serif;direction:rtl;text-align:right;font-size:15px;color:#3b3355}
.li.k .l-it::after{content:" ✓";color:var(--good)}
.li.w .l-it::after{content:" ✗";color:var(--bad)}
.li-h{border:none;background:none;cursor:pointer;padding:4px;display:flex}
.li-h svg{width:20px;height:20px;fill:none;stroke:#c9c2dd;stroke-width:2}
.li-h.on svg{fill:var(--heart);stroke:var(--heart)}
.more{display:block;width:100%;border:none;border-top:1px solid var(--line);background:var(--p50);color:var(--p800);font:inherit;font-weight:600;padding:12px;cursor:pointer}
.kbd{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
.hide{display:none!important}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.hello{font-size:20px;font-weight:800;color:var(--p900);margin:0 0 4px}
.muted{color:var(--muted);font-size:14px;line-height:1.5;margin:0}
.guest{background:linear-gradient(135deg,#6d28d9,#4c1d95);color:#fff;border:none}
.guest .muted{color:#e9e3ff}
.guest .btn{margin-top:12px;background:#fff;color:var(--p800);border:none;width:100%}
.ring{display:flex;align-items:center;gap:18px}
.ring svg{flex:none}
.ring .big{font-size:30px;font-weight:800;color:var(--p800);line-height:1}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:start;font:inherit;cursor:pointer;color:inherit}
.kpi:hover{border-color:var(--p300)}
.kpi b{display:block;font-size:26px;color:var(--p800);margin-bottom:2px}
.kpi span{font-size:13px;color:var(--muted)}
.kpi em{display:block;font-style:normal;font-size:12px;color:var(--p600);margin-top:6px;font-weight:600}
.chs{display:grid;gap:4px}
.chr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:9px 6px;border-radius:10px;border:none;background:none;font:inherit;cursor:pointer;text-align:start;color:inherit}
.chr:hover{background:var(--p50)}
.chr .nm{font-size:13.5px;font-weight:600;color:var(--ink);direction:ltr;text-align:left}
.chr .ct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chr .pb{grid-column:1/-1;height:6px;background:var(--p100);border-radius:6px;overflow:hidden}
.chr .pb i{display:block;height:100%;background:var(--p600)}
.h3{font-size:15px;font-weight:800;color:var(--p900);margin:0 0 10px}
.scrim{position:fixed;inset:0;background:rgba(30,27,46,.45);display:none;z-index:50;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:22px}}
.sheet h2{margin:0 0 6px;font-size:20px;color:var(--p900)}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:14.5px;line-height:1.55}
.perks{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:8px}
.perks li{display:flex;gap:10px;align-items:center;font-size:14.5px;background:var(--p50);border-radius:12px;padding:10px 12px}
.login{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font:inherit;font-weight:600;font-size:15px;padding:13px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;margin-top:8px;text-decoration:none}
.login:hover{background:var(--p50)}
.login.primary{background:var(--p700);color:#fff;border-color:var(--p700)}
.login svg{width:20px;height:20px}
.linkbtn{display:block;width:100%;margin-top:10px;border:none;background:none;font:inherit;font-size:14px;color:var(--muted);cursor:pointer;padding:10px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin:14px 0 6px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{font-size:13px;color:var(--muted);margin-top:10px;text-align:center;line-height:1.5}
.msg.err{color:#b91c1c}
.close{float:right;border:none;background:var(--p50);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--p800)}
html[dir=rtl] .close{float:left}
.danger{color:#b91c1c;background:#fff;border:1px solid #fecaca}
label.sm{font-size:13px;font-weight:600;color:var(--p800);display:block;margin:6px 0}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--p50);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--p800)}
.stat span{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13.5px;padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (max-width:520px){.nav{grid-template-columns:1fr 1fr}.li{grid-template-columns:1fr 34px}.li .l-fa{grid-column:1}.li .li-h{grid-row:1/3;grid-column:2}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img src="icon-192.png" alt="" width="40" height="40">
    <div>
      <h1>Patente Flash</h1>
      <p class="sub"><span id="total">…</span> <span data-t="cards"></span> · <bdi class="ltr">Italiano</bdi> → <bdi class="fa">فارسی</bdi></p>
    </div>
    <div class="hbtns">
      <div class="rel">
        <button class="round" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-label="Language">🌐 <span id="langCode">EN</span></button>
        <div class="menu" id="langMenu" role="menu">
          <button role="menuitemradio" data-lang="en" aria-checked="true">English <span>EN</span></button>
          <button role="menuitemradio" data-lang="fa" aria-checked="false"><span class="fa">فارسی</span> <span>FA</span></button>
        </div>
      </div>
      <button class="round" id="avatar" aria-label="Profile">👤</button>
    </div>
  </header>

  <nav class="views" role="tablist">
    <button class="vtab" role="tab" data-view="dash" aria-selected="true" data-t="dashboard"></button>
    <button class="vtab" role="tab" data-view="study" aria-selected="false" data-t="study"></button>
  </nav>

  <section id="dashView">
    <div class="panel guest" id="guestCard">
      <p class="hello" style="color:#fff" data-t="guestTitle"></p>
      <p class="muted" data-t="guestText"></p>
      <button class="btn" id="guestSignIn" data-t="signIn"></button>
    </div>
    <div class="panel">
      <p class="hello" id="hello"></p>
      <div class="ring">
        <svg width="92" height="92" viewBox="0 0 92 92" aria-hidden="true"><circle cx="46" cy="46" r="38" fill="none" stroke="#ede9fe" stroke-width="10"/><circle id="ringArc" cx="46" cy="46" r="38" fill="none" stroke="#7c3aed" stroke-width="10" stroke-linecap="round" stroke-dasharray="238.8" stroke-dashoffset="238.8" transform="rotate(-90 46 46)"/></svg>
        <div><div class="big" id="pct">0%</div><p class="muted" id="pctText"></p></div>
      </div>
      <button class="btn primary" id="continueBtn" style="width:100%;margin-top:16px" data-t="continue"></button>
    </div>
    <div class="kpis">
      <button class="kpi" data-go="todo"><b id="kTodo">0</b><span data-t="toLearn"></span><em data-t="practise"></em></button>
      <button class="kpi" data-go="known"><b id="kKnown">0</b><span data-t="known"></span><em data-t="review"></em></button>
      <button class="kpi" data-go="fav"><b id="kFav">0</b><span data-t="favorites"></span><em data-t="open"></em></button>
      <button class="kpi" data-go="wrong"><b id="kWrong">0</b><span data-t="mistakes"></span><em data-t="fix"></em></button>
    </div>
    <div class="panel">
      <p class="h3" data-t="byChapter"></p>
      <div class="chs" id="chList"></div>
    </div>
  </section>

  <section id="studyView" class="hide">
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-set="all" aria-selected="true" data-t="all"></button>
      <button class="tab" role="tab" data-set="todo" aria-selected="false" data-t="toLearn"></button>
      <button class="tab" role="tab" data-set="fav" aria-selected="false">❤️ <span class="n" id="nFav">0</span></button>
      <button class="tab" role="tab" data-set="wrong" aria-selected="false">✗ <span class="n" id="nWrong">0</span></button>
    </nav>
    <div class="controls">
      <select id="chap" aria-label="Chapter"></select>
      <input id="q" type="search" aria-label="Search">
    </div>
    <div class="row">
      <button class="chip" id="shuffle" aria-pressed="false" data-t="shuffle"></button>
      <button class="chip" id="listMode" aria-pressed="false" data-t="list"></button>
      <span class="stats" id="stats"></span>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div id="cardView">
      <div class="stage" id="stage">
        <button class="heart" id="heart" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.3C1.1 8.4 3.2 5 6.6 5c2 0 3.4 1.1 4.4 2.5C12 6.1 13.4 5 15.4 5c3.4 0 5.5 3.4 4.1 6.7C19.5 16.4 12 21 12 21z"/></svg></button>
        <button class="card" id="card">
          <div class="face front">
            <div class="tag"><span id="chFront"></span><span id="posFront"></span></div>
            <div class="it" id="itText"></div>
            <div class="hint" data-t="tapHint"></div>
          </div>
          <div class="face back">
            <div class="tag"><span id="chBack"></span><span id="posBack"></span></div>
            <div class="fa-main" id="faText"></div>
            <div class="it-small" id="itSmall"></div>
            <div class="badges"><span class="badge b-wrong">✗</span><span class="badge b-known">✓</span></div>
          </div>
        </button>
      </div>
      <div class="empty hide" id="empty"></div>
      <div class="nav" id="nav">
        <button class="btn" id="prev" data-t="prev"></button>
        <button class="btn again" id="again" data-t="wrong"></button>
        <button class="btn good" id="know" data-t="iKnow"></button>
        <button class="btn primary" id="next" data-t="next"></button>
      </div>
      <div class="kbd" data-t="keys"></div>
    </div>
    <div class="list" id="list"></div>
  </section>
</div>

<div class="scrim" id="welcome" role="dialog" aria-modal="true" aria-labelledby="wTitle">
  <div class="sheet">
    <button class="close" id="wClose" aria-label="Close">×</button>
    <h2 id="wTitle" data-t="welcomeTitle"></h2>
    <p data-t="welcomeText"></p>
    <ul class="perks">
      <li>❤️ <span data-t="perkFav"></span></li>
      <li>✗ <span data-t="perkWrong"></span></li>
      <li>📊 <span data-t="perkDash"></span></li>
      <li>📱 <span data-t="perkSync"></span></li>
    </ul>
    <div id="authBox">
      <button class="login" id="loginGoogle" type="button"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.5c2.1-1.9 3.3-4.7 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.5-2.7c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.6H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.7 14.1a6.6 6.6 0 0 1 0-4.2V7.1H2.1a11 11 0 0 0 0 9.8l3.6-2.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.1-3.1A11 11 0 0 0 2.1 7.1l3.6 2.8C6.6 7.3 9.1 5.4 12 5.4z"/></svg><span data-t="google"></span></button>
      <div class="or" id="orLine"><span data-t="orEmail"></span></div>
      <form id="emailForm">
        <input type="email" id="emailInput" required placeholder="name@gmail.com" autocomplete="email" class="ltr">
        <button class="login primary" type="submit" id="emailBtn">✉️ <span data-t="sendLink"></span></button>
      </form>
      <p class="msg" id="loginMsg"></p>
    </div>
    <p class="msg hide" id="noLogin" data-t="noLogin"></p>
    <button class="linkbtn" id="guestBtn" data-t="guest"></button>
  </div>
</div>

<div class="scrim" id="profile" role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <div class="sheet">
    <button class="close" id="pClose" aria-label="Close">×</button>
    <h2 id="pTitle"></h2>
    <p id="pMeta" class="ltr" style="text-align:start"></p>
    <label class="sm" for="nameInput" data-t="displayName"></label>

</div>

<script>
(function(){

      continue:'ادامه مطالعه ←',toLearn:'برای یادگیری',known:'بلدم',favorites:'علاقه‌مندی‌ها',mistakes:'اشتباه‌ها',practise:'تمرین ←',review:'مرور ←',open:'باز کردن ←',fix:'رفع اشتباه‌ها ←',byChapter:'پیشرفت در هر فصل',
      all:'همه',shuffle:'درهم',list:'فهرست',search:'جستجوی کلمه ایتالیایی یا فارسی…',allChapters:'همه فصل‌ها',tapHint:'برای دیدن معنی لمس کنید',prev:'→ قبلی',wrong:'✗ اشتباه',iKnow:'✓ بلدم',next:'بعدی ←',
      keys:'فاصله = چرخاندن · ← / → = کارت · K = بلدم · X = اشتباه · F = ❤️',welcomeTitle:'به پاتنته فلش خوش آمدید 👋',welcomeText:'۱۹۴۹ کارت برای گواهینامه رانندگی ایتالیا، همراه با معنی فارسی هر کلمه. برای تجربه بهتر وارد شوید:',
      perkFav:'ذخیره کلمه‌های مورد علاقه',perkWrong:'فهرست اشتباه‌ها برای مرور',perkDash:'دنبال کردن پیشرفت در داشبورد',perkSync:'ادامه روی گوشی و کامپیوتر',google:'ادامه با گوگل',orEmail:'یا با ایمیل',sendLink:'ارسال لینک ورود به ایمیل',
      guest:'ادامه بدون ورود',noLogin:'ورود در حال حاضر در دسترس نیست. پیشرفت شما روی همین دستگاه ذخیره می‌شود.',displayName:'نام نمایشی',signOut:'خروج',hello:'سلام {n} 👋',helloGuest:'سلام 👋',
      pct:'{k} از {t} کلمه را بلدید',signedWith:'ورود با {p}',saving:'در حال ذخیره…',saved:'✓ در حساب شما ذخیره شد',notSaved:'هنوز ذخیره نشد — دوباره تلاش می‌شود',syncing:'در حال همگام‌سازی…',synced:'✓ همگام شد',offline:'استفاده از داده‌های همین دستگاه',
      sending:'در حال ارسال…',linkSent:'✓ ایمیل خود ({e}) را بررسی کنید و روی لینک بزنید.',opening:'در حال باز کردن…',error:'خطا: ',linkError:'لینک ورود کار نکرد ({m}). لطفاً یک لینک جدید درخواست کنید.',
      favAdded:'❤️ به علاقه‌مندی‌ها اضافه شد',favRemoved:'از علاقه‌مندی‌ها حذف شد',wrongAdded:'✗ در اشتباه‌ها ذخیره شد',wrongRemoved:'✓ از اشتباه‌ها حذف شد',signedOut:'خارج شدید',welcomeBack:'✓ وارد شدید',
      eFav:'هنوز علاقه‌مندی ندارید. روی ❤️ یک کارت بزنید.',eWrong:'هنوز اشتباهی ثبت نشده! روی «✗ اشتباه» بزنید تا اینجا بیاید.',eTodo:'آفرین! همه کلمه‌های این بخش را بلدید. 🎉',eKnown:'هنوز کلمه‌ای را «بلدم» نزده‌اید.',eNone:'کارتی پیدا نشد.'}
  };
  var lang='en';
  function t(k,v){var s=(T[lang]&&T[lang][k])||T.en[k]||k;if(v)Object.keys(v).forEach(function(x){s=s.split('{'+x+'}').join(v[x])});return s}
  function n2(n){return lang==='fa'?String(n).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]}):String(n)}

  var ALL=[],CH={},view=[],idx=0,LIMIT=200,shown=LIMIT,set='all';
  var S={known:{},fav:{},wrong:{},name:'',updated:0};
  var user=null,canLogin=false,saveTimer=null,sb=null,token=null;
  var $=function(id){return document.getElementById(id)};
  var KEY='patente-flash-v2';
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

  /* language */
  function applyLang(l){
    lang=l==='fa'?'fa':'en';ls('patente-lang',lang);
    document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';
    $('langCode').textContent=lang==='fa'?'FA':'EN';
    document.querySelectorAll('#langMenu button').forEach(function(b){b.setAttribute('aria-checked',b.dataset.lang===lang?'true':'false')});
    document.querySelectorAll('[data-t]').forEach(function(el){el.textContent=t(el.dataset.t)});
    $('q').placeholder=t('search');
    if(ALL.length){$('total').textContent=n2(ALL.length);fillChapters();counts();renderDash();render();renderList()}
    renderProfile();
  }
  $('langBtn').onclick=function(e){e.stopPropagation();var m=$('langMenu'),on=!m.classList.contains('on');m.classList.toggle('on',on);this.setAttribute('aria-expanded',on)};
  document.querySelectorAll('#langMenu button').forEach(function(b){b.onclick=function(){applyLang(b.dataset.lang);$('langMenu').classList.remove('on')}});
  document.addEventListener('click',function(e){if(!e.target.closest('.rel'))$('langMenu').classList.remove('on')});

  /* storage + sync */
  function loadLocal(){
    try{var d=JSON.parse(ls(KEY)||'null');if(d){S.known=d.known||{};S.fav=d.fav||{};S.wrong=d.wrong||{};S.name=d.name||'';S.updated=d.updated||0}
      else{S.known=JSON.parse(ls('patente-known')||'{}')||{}}}catch(e){}
  }
  function saveLocal(){ls(KEY,JSON.stringify(S))}
  function keys(o){return Object.keys(o)}
  function changed(){S.updated=Date.now();saveLocal();counts();if(user){clearTimeout(saveTimer);saveTimer=setTimeout(pushRemote,1200)}}
  function authHeaders(h){h=h||{};if(token)h['X-Sb-Token']=token;return h}
  function syncState(k){$('syncState').textContent=k?t(k):''}
  function pushRemote(){
    if(!user)return;syncState('saving');
    fetch('/api/progress',{method:'PUT',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({known:keys(S.known),fav:keys(S.fav),wrong:keys(S.wrong),name:S.name})})
      .then(function(r){if(!r.ok)throw 0;syncState('saved')}).catch(function(){syncState('notSaved');clearTimeout(saveTimer);saveTimer=setTimeout(pushRemote,15000)});
  }
  function pullRemote(){
    syncState('syncing');
    return fetch('/api/progress',{headers:authHeaders()}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
      var hadLocal=keys(S.known).length+keys(S.fav).length+keys(S.wrong).length>0;
      ['known','fav','wrong'].forEach(function(k){(d[k]||[]).forEach(function(w){S[k][w]=1})});
      keys(S.wrong).forEach(function(w){if(S.known[w]&&(d.wrong||[]).indexOf(w)<0)delete S.wrong[w]});
      if(d.name&&!S.name)S.name=d.name;
      saveLocal();counts();build(true);renderProfile();renderDash();syncState('synced');
      if(hadLocal)pushRemote();
    }).catch(function(){syncState('offline')});
  }

  /* auth (Supabase) */
  function readUrlError(){
    var q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,''));
    var m=q.get('error_description')||h.get('error_description')||q.get('error')||h.get('error');
    return m?m.replace(/\+/g,' '):null;
  }
  function cleanUrl(){if(location.search||location.hash)history.replaceState(null,'',location.pathname)}
  function initAuth(){
    var C=window.PATENTE_CONFIG||{};var urlErr=readUrlError();
    if(!window.supabase||!C.supabaseUrl||!C.supabaseAnonKey){canLogin=false;renderProfile();renderDash();maybeWelcome();return}
    try{
      // implicit flow: the email link carries the session itself, so it works even when Gmail opens it in another browser
      sb=window.supabase.createClient(C.supabaseUrl,C.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}});
    }catch(e){canLogin=false;renderProfile();renderDash();maybeWelcome();return}
    canLogin=true;
    var g=(C.providers||[]).indexOf('google')>=0;
    $('loginGoogle').classList.toggle('hide',!g);$('orLine').classList.toggle('hide',!g);
    var first=true;
    sb.auth.onAuthStateChange(function(ev,session){
      var wasUser=!!user;
      token=session?session.access_token:null;
      var u=session&&session.user;
      user=u?{id:u.id,email:u.email||'',provider:(u.app_metadata&&u.app_metadata.provider)||'email',meta:u.user_metadata||{}}:null;
      renderProfile();renderDash();
      if(user&&!wasUser){pullRemote();$('welcome').classList.remove('on');ls('patente-welcomed','1');if(ev==='SIGNED_IN')toast(t('welcomeBack'));cleanUrl()}
      if(first){first=false;
        if(urlErr&&!user){openWelcome();showMsg(t('linkError',{m:urlErr}),true);cleanUrl()}
        else if(!user)setTimeout(maybeWelcome,400);
      }
    });
  }
  function showMsg(s,err){var m=$('loginMsg');m.textContent=s;m.classList.toggle('err',!!err)}
  $('loginGoogle').onclick=function(){
    if(!sb)return;showMsg(t('opening'));
    sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/'}}).then(function(r){if(r.error)showMsg(t('error')+r.error.message,true)});
  };
  $('emailForm').onsubmit=function(e){
    e.preventDefault();if(!sb)return;var em=$('emailInput').value.trim();if(!em)return;
    $('emailBtn').disabled=true;showMsg(t('sending'));
    sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+'/'}}).then(function(r){
      $('emailBtn').disabled=false;
      if(r.error)showMsg(t('error')+r.error.message,true);else showMsg(t('linkSent',{e:em}));
    });
  };
  $('logout').onclick=function(){if(sb)sb.auth.signOut();user=null;token=null;renderProfile();renderDash();$('profile').classList.remove('on');toast(t('signedOut'))};
  function openWelcome(){showMsg('');$('welcome').classList.add('on')}
  function maybeWelcome(){if(!user&&!ls('patente-welcomed'))openWelcome()}
  function closeWelcome(){$('welcome').classList.remove('on');ls('patente-welcomed','1')}
  $('wClose').onclick=closeWelcome;$('guestBtn').onclick=closeWelcome;
  $('welcome').onclick=function(e){if(e.target===$('welcome'))closeWelcome()};
  $('guestSignIn').onclick=openWelcome;
  $('avatar').onclick=function(){if(user){counts();$('profile').classList.add('on')}else openWelcome()};
  $('pClose').onclick=function(){$('profile').classList.remove('on')};
  $('profile').onclick=function(e){if(e.target===$('profile'))$('profile').classList.remove('on')};
  $('nameInput').onchange=function(){S.name=this.value.trim().slice(0,40);changed();renderProfile();renderDash()};
  function displayName(){return S.name||(user&&(user.meta.full_name||user.meta.name||(user.email||'').split('@')[0]))||''}
  function renderProfile(){
    $('authBox').classList.toggle('hide',!canLogin);$('noLogin').classList.toggle('hide',canLogin);
    var av=$('avatar');
    if(user){
      var nm=displayName();$('pTitle').textContent=t('hello',{n:nm});$('nameInput').value=S.name||'';
      var pv={google:'Google',email:'email'}[user.provider]||user.provider;
      $('pMeta').textContent=t('signedWith',{p:pv})+(user.email?' · '+user.email:'');
      av.textContent=(nm.trim()[0]||'★').toUpperCase();av.classList.add('on');
    }else{av.textContent='👤';av.classList.remove('on')}
  }

  /* dashboard */
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function renderDash(){
    if(!ALL.length)return;
    $('guestCard').classList.toggle('hide',!!user||!canLogin);
    $('hello').textContent=user?t('hello',{n:displayName()}):t('helloGuest');
    var tot=ALL.length,k=0,f=0,w=0;ALL.forEach(function(c){if(S.known[c[0]])k++;if(S.fav[c[0]])f++;if(S.wrong[c[0]])w++});
    $('pct').textContent=n2(Math.round(k/tot*100))+'%';$('pctText').textContent=t('pct',{k:n2(k),t:n2(tot)});
    $('ringArc').setAttribute('stroke-dashoffset',String(238.8*(1-k/tot)));
    $('kTodo').textContent=n2(tot-k);$('kKnown').textContent=n2(k);$('kFav').textContent=n2(f);$('kWrong').textContent=n2(w);
    var per={};ALL.forEach(function(c){var o=per[c[2]]||(per[c[2]]={t:0,k:0});o.t++;if(S.known[c[0]])o.k++});
    var h='';Object.keys(per).sort(function(a,b){return a-b}).forEach(function(n){var o=per[n];
      h+='<button class="chr" data-ch="'+n+'"><span class="nm">'+n+'. '+esc(CH[n]||'')+'</span><span class="ct">'+n2(o.k)+'/'+n2(o.t)+'</span><span class="pb"><i style="width:'+(o.k/o.t*100)+'%"></i></span></button>'});
    $('chList').innerHTML=h;
  }
  $('chList').onclick=function(e){var b=e.target.closest('.chr');if(!b)return;$('chap').value=b.dataset.ch;showView('study');selectSet('todo')};
  document.querySelectorAll('.kpi').forEach(function(b){b.onclick=function(){$('chap').value='all';showView('study');selectSet(b.dataset.go)}});
  $('continueBtn').onclick=function(){showView('study');selectSet('todo')};
  function showView(v){
    document.querySelectorAll('.vtab').forEach(function(b){b.setAttribute('aria-selected',b.dataset.view===v?'true':'false')});
    $('dashView').classList.toggle('hide',v!=='dash');$('studyView').classList.toggle('hide',v!=='study');
    if(v==='dash')renderDash();window.scrollTo(0,0);
  }
  document.querySelectorAll('.vtab').forEach(function(b){b.onclick=function(){showView(b.dataset.view)}});

  /* study */
  function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/‌/g,'')}
  function shuffleA(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
  function counts(){
    var f=keys(S.fav).length,w=keys(S.wrong).length,k=keys(S.known).length;
    $('nFav').textContent=n2(f);$('nWrong').textContent=n2(w);$('sFav').textContent=n2(f);$('sWrong').textContent=n2(w);$('sKnown').textContent=n2(k);
  }
  function fillChapters(){
    var cur=$('chap').value||'all',cn={};ALL.forEach(function(c){cn[c[2]]=(cn[c[2]]||0)+1});
    var o='<option value="all">'+esc(t('allChapters'))+' ('+n2(ALL.length)+')</option>';
    Object.keys(CH).sort(function(a,b){return a-b}).forEach(function(n){if(cn[n])o+='<option value="'+n+'">'+esc(n+'. '+CH[n])+' ('+n2(cn[n])+')</option>'});
    $('chap').innerHTML=o;$('chap').value=cur;
  }
  function build(keepPos){
    var cur=view[idx]&&view[idx][0];
    var ch=$('chap').value,q=norm($('q').value.trim());
    view=ALL.filter(function(c){
      if(set==='fav'&&!S.fav[c[0]])return false;
      if(set==='wrong'&&!S.wrong[c[0]])return false;
      if(set==='todo'&&S.known[c[0]])return false;
      if(set==='known'&&!S.known[c[0]])return false;
      if(ch&&ch!=='all'&&String(c[2])!==ch)return false;
      if(q&&norm(c[0]).indexOf(q)<0&&norm(c[1]).indexOf(q)<0)return false;
      return true;
    });
    if($('shuffle').getAttribute('aria-pressed')==='true')shuffleA(view);
    idx=0;if(keepPos&&cur){for(var i=0;i<view.length;i++)if(view[i][0]===cur){idx=i;break}}
    shown=LIMIT;render();renderList();
  }
  function emptyText(){if($('q').value)return t('eNone');return t({fav:'eFav',wrong:'eWrong',todo:'eTodo',known:'eKnown'}[set]||'eNone')}
  function render(){
    var has=view.length>0;
    $('stage').classList.toggle('hide',!has);$('nav').classList.toggle('hide',!has);$('empty').classList.toggle('hide',has);
    if(!has)$('empty').textContent=emptyText();
    $('stats').textContent=has?n2(idx+1)+' / '+n2(view.length):n2(0);
    $('prog').style.width=has?((idx+1)/view.length*100)+'%':'0';
    if(!has)return;
    var c=view[idx],card=$('card'),w=c[0];
    card.classList.remove('flipped');
    card.classList.toggle('is-known',!!S.known[w]);card.classList.toggle('is-wrong',!!S.wrong[w]);
    var h=$('heart');h.classList.toggle('on',!!S.fav[w]);h.setAttribute('aria-pressed',S.fav[w]?'true':'false');h.setAttribute('aria-label',t('favorites'));
    $('itText').textContent=w;$('itSmall').textContent=w;$('faText').textContent=c[1];
    var label='Cap. '+c[2];$('chFront').textContent=label;$('chBack').textContent=label;
    var pos=(idx+1)+'/'+view.length;$('posFront').textContent=pos;$('posBack').textContent=pos;
  }
  var HEART='<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.3C1.1 8.4 3.2 5 6.6 5c2 0 3.4 1.1 4.4 2.5C12 6.1 13.4 5 15.4 5c3.4 0 5.5 3.4 4.1 6.7C19.5 16.4 12 21 12 21z"/></svg>';
  function renderList(){
    var el=$('list');if(!el.classList.contains('on'))return;
    var h='',n=Math.min(shown,view.length);
    for(var i=0;i<n;i++){var w=view[i][0];h+='<div class="li'+(S.known[w]?' k':'')+(S.wrong[w]?' w':'')+'"><div class="l-it"></div><div class="l-fa"></div><button class="li-h'+(S.fav[w]?' on':'')+'" data-i="'+i+'" aria-label="❤️">'+HEART+'</button></div>'}
    el.innerHTML=h+(view.length>n?'<button class="more" id="more">+ '+n2(view.length-n)+'</button>':'')+(view.length?'':'<div class="empty" style="border:none"></div>');
    if(!view.length)el.querySelector('.empty').textContent=emptyText();
    var rows=el.querySelectorAll('.li');
    for(var j=0;j<rows.length;j++){rows[j].children[0].textContent=view[j][0];rows[j].children[1].textContent=view[j][1]}
    var m=$('more');if(m)m.onclick=function(){shown+=LIMIT;renderList()};
  }
  $('list').addEventListener('click',function(e){var b=e.target.closest('.li-h');if(!b)return;var w=view[+b.dataset.i][0];toggleFav(w);b.classList.toggle('on',!!S.fav[w])});
  function toast(s){var el=$('toast');el.textContent=s;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('on')},1600)}
  function toggleFav(w){if(S.fav[w]){delete S.fav[w];toast(t('favRemoved'))}else{S.fav[w]=1;toast(t('favAdded'))}changed()}
  function flip(){$('card').classList.toggle('flipped')}
  function go(d){if(!view.length)return;idx=(idx+d+view.length)%view.length;render()}
  function mark(known){
    if(!view.length)return;var w=view[idx][0];
    if(known){S.known[w]=1;if(S.wrong[w]){delete S.wrong[w];toast(t('wrongRemoved'))}}
    else{S.wrong[w]=1;delete S.known[w];toast(t('wrongAdded'))}
    changed();
    var leaves=((set==='todo'||set==='wrong')&&known)||(set==='known'&&!known);
    if(leaves){view.splice(idx,1);if(idx>=view.length)idx=0;render()}else go(1);
  }
  function selectSet(s){set=s;document.querySelectorAll('.tab').forEach(function(x){x.setAttribute('aria-selected',x.dataset.set===s?'true':'false')});build()}
  function toggle(btn,cb){btn.onclick=function(){btn.setAttribute('aria-pressed',btn.getAttribute('aria-pressed')==='true'?'false':'true');cb()}}
  $('card').onclick=flip;
  $('heart').onclick=function(e){e.stopPropagation();if(!view.length)return;toggleFav(view[idx][0]);render();if(set==='fav'&&!S.fav[view[idx]&&view[idx][0]])build(true)};
  $('next').onclick=function(){go(1)};$('prev').onclick=function(){go(-1)};
  $('know').onclick=function(){mark(true)};$('again').onclick=function(){mark(false)};
  document.querySelectorAll('.tab').forEach(function(x){x.onclick=function(){selectSet(x.dataset.set)}});
  $('chap').onchange=function(){build()};
  var tq;$('q').oninput=function(){clearTimeout(tq);tq=setTimeout(build,150)};
  toggle($('shuffle'),build);
  toggle($('listMode'),function(){var on=$('listMode').getAttribute('aria-pressed')==='true';$('list').classList.toggle('on',on);$('cardView').classList.toggle('hide',on);renderList()});
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
    if(e.key==='Escape'){$('profile').classList.remove('on');if($('welcome').classList.contains('on'))closeWelcome();$('langMenu').classList.remove('on');return}
    if($('studyView').classList.contains('hide')||document.querySelector('.scrim.on'))return;
    if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}
    else if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
    else if(e.key==='k'||e.key==='K')mark(true);else if(e.key==='x'||e.key==='X')mark(false);
    else if(e.key==='f'||e.key==='F'){if(view.length){toggleFav(view[idx][0]);render()}}
  });
  var sx=null,sy=null;
  $('stage').addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  $('stage').addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){e.preventDefault();go(dx<0?1:-1)}sx=null},{passive:false});

  /* start */
  loadLocal();
  applyLang(ls('patente-lang')||'en');
  fetch('cards.json').then(function(r){return r.json()}).then(function(d){
    CH=d.chapters;ALL=d.cards;
    $('total').textContent=n2(ALL.length);
    fillChapters();counts();build();renderDash();initAuth();
  }).catch(function(){$('empty').textContent='Could not load the cards.';$('empty').classList.remove('hide')});
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
